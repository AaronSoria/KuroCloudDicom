[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "KuroCloudDicom"
version = "0.0.3"
description = "A new library for compute volume using lithops and a new kind of Dicom Files stored in cloud"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luis Aaron Maximiliano", email = "soria_aaron@outlook.com" }]
requires-python = ">=3.9"
dependencies = [
    "python-gdcm>=3.0.10,<4",
    "boto3>=1.26,<2",
    "numpy>=1.21,<3",
    "cloudpickle>=2.0,<4",
    "pydicom>=2.2,<3",
    "Pillow>=9.0,<13",
    "lithops>=2.9,<4",
    "scipy>=1.7,<2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Homepage = "https://github.com/AaronSoria/KuroCloudDicom"

[project.optional-dependencies]
dev = ["pytest>=8", "moto[s3]>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["KuroCloudDicom*"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
